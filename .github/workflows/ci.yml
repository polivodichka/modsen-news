name: CI/CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"
      - run: yarn install --frozen-lockfile
      - run: yarn lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"
      - run: yarn install --frozen-lockfile
      - run: yarn test --ci

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint
    env:
      NEXT_PUBLIC_GUARDIAN_API_URL: http://localhost:3000/api/mock/guardian
      NEXT_PUBLIC_GUARDIAN_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"
      - run: yarn install --frozen-lockfile
      - run: yarn integration-test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, e2e]
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    env:
      NEXT_PUBLIC_GUARDIAN_API_KEY: ${{ secrets.NEXT_PUBLIC_GUARDIAN_API_KEY }}
      NEXT_PUBLIC_GUARDIAN_API_URL: ${{ secrets.NEXT_PUBLIC_GUARDIAN_API_URL }}
      NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.ref_name }}
          path: .next/
          retention-days: 1

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"
      - run: yarn install --frozen-lockfile
      - uses: amondnet/vercel-action@v25
        id: vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
      - name: Production URL
        run: echo "Production url ${{ steps.vercel-deploy.outputs.preview-url }}"

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/dev'
    environment: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"
      - run: yarn install --frozen-lockfile
      - uses: amondnet/vercel-action@v25
        id: vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Preview URL
        run: echo "Preview url ${{ steps.vercel-deploy.outputs.preview-url }}"
